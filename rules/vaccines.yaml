# Vaccination schedules for dogs and cats, as open data. European sources only.
# PawID turns these into a timeline from the pet's birth date. It is the typical schedule from
# the source: the vet decides, and the passport is the record.
#
# Ages: { w: 8 } = 8 weeks after birth, { m: 15 } = 15 months. "to" makes a range.
# status:
#   verified      = read on the cited page on last_checked; the quote is copied from it
#   needs_review  = partial, secondary or ambiguous; shown with a warning and no computed date
# Research notes with every quote: research_notes/vaccine-schedules/ (not part of the data).
#
# Never add an age or an interval without a source. If a source is unclear, leave it out.

last_checked: "2026-11-22"

