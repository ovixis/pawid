name = "pawid-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# The page a venue sees after scanning a QR code, on the HosPet domain (the zone hospet.eu is on Cloudflare).
# The API stays on workers.dev as well.
workers_dev = true
routes = [{ pattern = "pawid.hospet.eu/v/*", zone_name = "hospet.eu" }]

# Vet passkeys: the site where vets confirm. VET_SIGNING_KEY is a secret (wrangler secret put VET_SIGNING_KEY).
[vars]
VET_RP_ID = "pawid.hospet.eu"
VET_ORIGINS = "https://pawid.hospet.eu"

# Created with: npx wrangler d1 create pawid --jurisdiction eu
[[d1_databases]]
binding = "DB"
database_name = "pawid"
database_id = "c58620f1-8fb5-4898-a5be-d3794bd7d0fc"
migrations_dir = "migrations"

# Daily job (09:00 UTC): deletes usage counters older than about 13 months.
[triggers]
crons = ["0 9 * * *"]
