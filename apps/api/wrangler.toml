name = "pawid-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Create the database with:  npx wrangler d1 create pawid
# then paste the database_id it prints.
[[d1_databases]]
binding = "DB"
database_name = "pawid"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

# Daily job for reminders (09:00 UTC).
[triggers]
crons = ["0 9 * * *"]
